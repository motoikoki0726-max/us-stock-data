name: SECデータ更新

on:
  schedule:
    - cron: "17 10 * * *"   # 毎日 10:17 UTC（日本時間 19:17）。SECの一括データは米国東部時間の深夜に更新される
  workflow_dispatch:         # Actions画面の「Run workflow」ボタンで手動実行もできる

permissions:
  contents: write            # dataブランチへの書き込みに必要

concurrency:
  group: sec-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SECから取得して整形
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}   # Settings → Secrets and variables → Actions に登録した「名前 メールアドレス」
        run: python build_data.py --out out --work work

      - name: dataブランチへ公開（履歴は残さず毎回上書き）
        run: |
          cd out
          git init -q
          git checkout -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "SEC data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
